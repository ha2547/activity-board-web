{% extends 'base.html' %}

{% block title %}로그인 {{ app_version }}{% endblock %}

{% block content %}
<section class="login-wrap">
  <article class="login-card">
    <div class="section-head">
      <p class="eyebrow">Sign In</p>
      <h2>Activity Board 로그인</h2>
    </div>

    <form class="login-form" method="post">
      <input type="hidden" name="next" value="{{ next_target }}">
      {% if remembered_name %}
      <p class="remembered-name">최근 로그인: {{ remembered_name }}</p>
      {% endif %}
      <label>
        <span>사번</span>
        <input type="text" name="employee_id" placeholder="숫자 사번 입력" inputmode="numeric" required autofocus>
      </label>
      <button type="submit">로그인</button>
    </form>

    <div class="auth-extra-actions">
      <span>계정이 없으신가요?</span>
      <a class="secondary-link" href="{{ url_for('register_user') }}">사용자 등록</a>
    </div>
  </article>
</section>
{% endblock %}
